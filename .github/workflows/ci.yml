name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The official gitleaks-action needs a license for organizations, so we run the
      # pinned release binary and verify its checksum instead.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history for secrets
        run: ./gitleaks git --redact --verbose

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t quitado:ci .
      - name: Start it and wait until it is healthy
        run: |
          docker run -d --name quitado -p 3000:3000 \
            -e QUITADO_RECIPIENT=E2pDM8RRwhiPhJVzpF1sN8JzvUDmPP6eG7M4xH8FbQxL \
            -e QUITADO_ACCESS_SECRET=ci-only-secret-not-used-anywhere-123456 \
            -e QUITADO_BASE_URL=http://localhost:3000 \
            quitado:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/healthz
      - name: Check it runs as a non-root user
        run: test "$(docker exec quitado id -u)" != "0"
      - name: Check it shuts down cleanly on SIGTERM
        run: |
          docker stop quitado
          test "$(docker inspect -f '{{.State.ExitCode}}' quitado)" = "0"
